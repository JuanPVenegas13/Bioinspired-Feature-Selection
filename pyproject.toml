[project]
name = "bfs"
version = "0.1.0"
description = "Réplica de CBPSO-MIWS (Too et al., 2019) para selección de variables"
readme = "README.md"
authors = [
    { name = "Arie Zalo González Álvarez" },
    { name = "Juan Pablo Venegas" },
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]